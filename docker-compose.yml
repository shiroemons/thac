services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=thac
      # WARNING: 開発専用設定。本番環境では POSTGRES_PASSWORD によるパスワード認証を使用すること
      - POSTGRES_HOST_AUTH_METHOD=trust
      # === 本番環境への移行時の参考設定 ===
      # 1. 認証: 本番では POSTGRES_HOST_AUTH_METHOD=trust を削除し、POSTGRES_PASSWORD を設定
      #    例: POSTGRES_PASSWORD=secure_production_password
      # 2. 接続制限: max_connections を環境に応じて設定（デフォルト100）
      #    小規模: 50-100 | 中規模: 100-300 | 大規模: 300+
      # 3. メモリ設定: 利用可能なRAMの25%程度を目安に
      #    - shared_buffers: RAM の 25% (例: 4GB RAM → 1GB)
      #    - effective_cache_size: RAM の 50-75% (例: 4GB RAM → 2-3GB)
      #    - work_mem: shared_buffers / max_connections (例: 1GB / 100 → 10MB)
      # 4. ログ: スロークエリの検知用に設定
      #    log_min_duration_statement: 1000 (1秒以上のクエリをログ)
      # 5. バックアップ: 以下を定期実行
      #    - WAL アーカイブ設定 (wal_level=replica等)
      #    - pg_dump による定期バックアップ
      #    - リカバリ手順のテスト
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "thac"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  server:
    image: node:24.12.0-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@11.1.2 --activate && pnpm install --frozen-lockfile --force && pnpm --dir apps/server dev"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres@postgres:5432/thac
      - BETTER_AUTH_URL=http://localhost:3001
      - CORS_ORIGIN=http://localhost:3000
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-development_master_key}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  web:
    image: node:24.12.0-bookworm-slim
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@11.1.2 --activate && pnpm install --frozen-lockfile --force && rm -rf apps/web/node_modules/.vite && pnpm --dir apps/web exec vite dev --port=3000 --host --strictPort"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_SERVER_URL=http://localhost:3001
      - SERVER_URL=http://server:3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-development_master_key}
      - MEILI_NO_ANALYTICS=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
  # 外部ボリュームのため、事前に作成が必要: docker volume create thac_meilisearch_data
  meilisearch_data:
    external: true
    name: thac_meilisearch_data
