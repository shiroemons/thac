name: Update Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - '**/package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update lockfile
        run: bun install --no-frozen-lockfile

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update bun.lock"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Retrigger CI by closing and reopening PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
          sleep 2
          gh pr reopen ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
