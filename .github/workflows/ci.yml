name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Note: PostgreSQLサービスコンテナは不要
    # テストはPGlite（インメモリPostgreSQL互換エンジン）を使用するため、
    # 外部のPostgreSQLインスタンスなしでPostgreSQL互換テストを実行可能
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - '!**.md'
              - '!docs/**'
              - '!.claude/**'
              - '!.github/**'
              - '!LICENSE'

      - if: steps.filter.outputs.source == 'true'
        uses: oven-sh/setup-bun@v2

      - if: steps.filter.outputs.source == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - if: steps.filter.outputs.source == 'true'
        run: bun install --frozen-lockfile

      - if: steps.filter.outputs.source == 'true'
        name: Run CI checks
        run: bun run check && bun run check-types && bun run --cwd apps/web lint:jsx-nesting && bun run test
