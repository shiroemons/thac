name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/**'
      - 'LICENSE'

jobs:
  ci:
    runs-on: ubuntu-latest
    # Note: PostgreSQLサービスコンテナは不要
    # テストはPGlite（インメモリPostgreSQL互換エンジン）を使用するため、
    # 外部のPostgreSQLインスタンスなしでPostgreSQL互換テストを実行可能
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0

      - run: corepack enable
      - run: corepack prepare pnpm@11.1.2 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm check && pnpm check-types && pnpm --dir apps/web lint:jsx-nesting && pnpm test
