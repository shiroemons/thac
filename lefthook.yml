# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: pnpm check
    check-types:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm check-types
    lint-jsx-nesting:
      glob: "apps/web/**/*.{tsx,jsx}"
      run: pnpm --dir apps/web lint:jsx-nesting
