version: '3'

vars:
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts/tasks'

tasks:
  dev:
    desc: 全開発サービスをフォアグラウンドで起動
    cmds:
      - bash "{{.SCRIPTS_DIR}}/services.sh" dev
    interactive: true

  up:
    desc: 全開発サービスをバックグラウンドで起動
    cmds:
      - bash "{{.SCRIPTS_DIR}}/services.sh" up

  down:
    desc: 全開発サービスを停止
    cmds:
      - bash "{{.SCRIPTS_DIR}}/services.sh" down

  status:
    desc: 開発サービスの状態を表示
    cmds:
      - bash "{{.SCRIPTS_DIR}}/services.sh" status

  restart:
    desc: 全開発サービスを再起動
    cmds:
      - bash "{{.SCRIPTS_DIR}}/services.sh" restart

  stop-app:
    desc: Web・APIのみ停止してDB・Meilisearchを維持
    cmds:
      - bash "{{.SCRIPTS_DIR}}/stop-app.sh"

  ensure-postgres:
    internal: true
    cmds:
      - bash "{{.SCRIPTS_DIR}}/ensure-postgres.sh"
